name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch o commit da buildare'
        required: false
        default: 'main'
      version_override:
        description: 'Tag release (es. v2.6.2). Vuoto = legge app.json'
        required: false
        default: ''

permissions:
  contents: write

# Two runs publishing the same tag (a tag push plus a dispatch) must not race.
concurrency:
  group: build-release
  cancel-in-progress: false

env:
  # Force Node 24 for any JS-based actions still declaring Node 20 in their action.yml.
  # Node 20 is being removed from runners on 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    # Signing secrets are passed only to the steps that need them, never to
    # third-party actions (which get the whole job environment).
    env:
      RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/release.keystore

    steps:
      - name: Compute checkout ref
        id: co
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if [[ -n "$INPUT_REF" ]]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.co.outputs.ref }}

      - name: Compute checked out source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default ("tools platform-tools") fails since Google
          # removed the legacy "tools" package; the components we need are
          # installed explicitly in the next step.
          packages: 'platform-tools'

      - name: Install SDK components
        run: |
          echo "y" | sdkmanager \
            "ndk;27.1.12297006" \
            "build-tools;37.0.0" \
            "platforms;android-37.0" \
            "cmake;3.22.1"

      - name: Install dependencies
        # Lockfile-exact install: a release must build the dependencies that were tested.
        run: npm ci --legacy-peer-deps

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Fix expo-modules-core Gradle bugs
        run: |
          FILE="node_modules/expo-modules-core/android/build.gradle"
          sed -i "s|apply plugin: 'com.android.library'|// Fix: project-level re-declaration\ndef _coreFeatures = project.findProperty(\"coreFeatures\") ?: []\next.shouldIncludeCompose = _coreFeatures.contains(\"compose\")\n\napply plugin: 'com.android.library'|" "$FILE"
          sed -i 's/^\s*compose shouldIncludeCompose\s*$/    compose = shouldIncludeCompose/' "$FILE"

      - name: Compute release tag
        id: meta
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            TAG="$VERSION_OVERRIDE"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      - name: Never replace an already-published release from a branch push
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # A push to main without a version bump used to rebuild and silently
          # swap the APK of the existing release. Tag pushes and manual runs
          # still publish; a branch push only builds as a check.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" != refs/tags/* ]] \
            && gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists: building only, not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Missing KEYSTORE_BASE64 secret"
            exit 1
          fi
          for var in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "Missing $var secret"
              exit 1
            fi
          done
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_STORE_FILE"

      - name: Build release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease \
            --no-daemon \
            -Pandroid.overridePathCheck=true
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove release keystore
        if: always()
        run: rm -f "$RELEASE_STORE_FILE"

      - name: Validate APK release metadata
        run: |
          PHONE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [[ -z "$PHONE_APK" ]]; then
            echo "Missing phone release APK"
            exit 1
          fi

          PHONE_BADGING=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$PHONE_APK")
          PHONE_PACKAGE=$(echo "$PHONE_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          PHONE_VERSION_NAME=$(echo "$PHONE_BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          PHONE_VERSION_CODE=$(echo "$PHONE_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          EXPECTED_PACKAGE=$(node -p "require('./app.json').expo.android.package")
          EXPECTED_TAG="v${PHONE_VERSION_NAME}"

          echo "Phone APK: $PHONE_PACKAGE v$PHONE_VERSION_NAME ($PHONE_VERSION_CODE)"
          echo "Release tag=${{ steps.meta.outputs.tag }}"

          if [[ "$PHONE_PACKAGE" != "$EXPECTED_PACKAGE" ]]; then
            echo "Phone package name must match $EXPECTED_PACKAGE"
            exit 1
          fi
          if [[ "${{ steps.meta.outputs.version }}" != "$PHONE_VERSION_NAME" ]]; then
            echo "app.json and phone versionName values do not match"
            exit 1
          fi

          if [[ "${{ steps.meta.outputs.tag }}" != "$EXPECTED_TAG" ]]; then
            echo "Release tag (${{ steps.meta.outputs.tag }}) does not match APK versionName ($PHONE_VERSION_NAME)"
            exit 1
          fi

          PHONE_CERT=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$PHONE_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [[ -z "$PHONE_CERT" ]]; then
            echo "Could not read phone signing certificate SHA-256 digest"
            exit 1
          fi
          echo "Signing certificate SHA-256: $PHONE_CERT"
          # Set the repository variable EXPECTED_SIGNING_CERT_SHA256 to enforce the key.
          EXPECTED_CERT="${{ vars.EXPECTED_SIGNING_CERT_SHA256 }}"
          if [[ -n "$EXPECTED_CERT" && "${PHONE_CERT,,}" != "${EXPECTED_CERT,,}" ]]; then
            echo "APK is signed with an unexpected certificate"
            exit 1
          fi

      - name: Rename APK
        run: |
          PHONE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          PHONE_DEST="AeroStaffPro-${{ steps.meta.outputs.tag }}.apk"
          cp "$PHONE_APK" "$PHONE_DEST"
          echo "apk=$PHONE_DEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: steps.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "AeroStaff Pro ${{ steps.meta.outputs.tag }}"
          target_commitish: ${{ steps.source.outputs.sha }}
          generate_release_notes: true
          files: |
            ${{ env.apk }}
          draft: false
          prerelease: false
